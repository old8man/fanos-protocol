name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The heavy suites below are too slow for every push, but a proof that goes unrun is a proof that decays.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  # The nightly toolchain, components, and targets are pinned by rust/rust-toolchain.toml,
  # so every job installs exactly the same compiler.
  #
  # NOTE ON FORMATTING: there is deliberately no `cargo fmt --check` step. The source is hand-wrapped to a
  # denser width than rustfmt's 100-column default (that density is what keeps the pedantic clippy set
  # readable), so `cargo fmt` rewrites ~2650 hunks of intentional formatting. A gate that has never passed
  # cannot catch anything and — as the first step of this job — hid every gate below it.
  gate:
    name: clippy · test · verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show   # rust-toolchain.toml drives the install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Both feature configurations are linted and tested: `validator` compiles the ledger/consensus paths,
      # and three `cfg(not(feature = "validator"))` fallbacks exist that only the default build sees. Neither
      # configuration is a superset of the other, so neither run is redundant.
      - name: Clippy — default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy — validator features
        run: cargo clippy --workspace --all-targets --features validator -- -D warnings
      # A third configuration, compile-only: the VPN datapath is behind `vpn` because it pulls a real TUN
      # device, so neither clippy run above sees a line of it. A feature nobody builds is a feature that
      # rots — this is the cheapest possible guard against that, and it is not a substitute for exercising
      # the datapath (nothing does yet).
      - name: Clippy — the vpn feature (real TUN device)
        run: cargo clippy -p fanos-node --features vpn --all-targets -- -D warnings
      # And the three remaining feature surfaces nothing else builds. Traced by enumerating every declared
      # feature and asking what enables it: `fanos-primitives`' `aead`/`wire` and `fanos-nyx`'s
      # `transparent-onion` are turned on by dependents, so the runs above compile them. These three are
      # turned on by nobody — `observatory/sim` gates a target behind `required-features`, so
      # `cargo test --workspace` SKIPS it rather than failing, which is the quietest form of the same gap.
      # All three compiled clean when this was added; the point is that nothing was keeping them that way.
      - name: Clippy — the feature surfaces no other job compiles
        run: |
          cargo clippy -p fanos-observatory --features sim --all-targets -- -D warnings
          cargo clippy -p fanos-telemetry --features sysinfo --all-targets -- -D warnings
          cargo clippy -p fanos-wasm --features wasm --all-targets -- -D warnings
      # `--no-fail-fast`, and it is not a style preference. `cargo test` stops at the FIRST failing target,
      # so every target ordered after it goes unrun and reports nothing — a green-looking absence rather than
      # a red result. Measured 2026-08-04: `fanos-wire`'s conformance KAT had been failing for six days
      # behind a live-QUIC flake that happened to run earlier, and nobody could have seen it. A run that
      # hides its own coverage is worth less than a slower one that does not.
      # The real-QUIC integration targets are **excluded here and run alone below**, and that is a
      # measurement property rather than a preference. Since 2026-08-04 every one of them runs on a
      # multi-threaded runtime (4 workers), because a current-thread harness cannot observe a parallelism
      # defect at all (#84) — so fifteen test binaries in parallel oversubscribe the runner several times
      # over. Their own `require_quiet_host` guard then correctly reports INCONCLUSIVE (measured: cpu share
      # 0.18 in a full parallel run, against 9 of 9 passing in 13 s when the target runs alone), and a run
      # that goes red because it could not measure teaches everyone to ignore red.
      - name: Tests — default features (excluding the real-QUIC targets)
        run: cargo test --workspace --no-fail-fast --exclude fanos-node --exclude fanos-quic
      - name: Tests — fanos-quic and fanos-node, with the runner to themselves
        run: |
          cargo test -p fanos-quic --no-fail-fast
          cargo test -p fanos-node --no-fail-fast
      # There is deliberately no `cargo test --workspace --features validator --exclude fanos-node` step.
      # It was here, and it could never run: `validator` is declared on `fanos-node` and nowhere else, so
      # excluding that package leaves cargo with a feature no selected package has and it errors out before
      # a single test — *"none of the selected packages contains this feature: validator"*. The step was
      # named for the ledger/consensus/TAXIS tests and never ran them.
      #
      # It was also redundant even if it had run. `fanos-taxis` and `fanos-dromos` are workspace members, so
      # the default step above tests them directly; the feature only decides whether `fanos-node` links them.
      # The step below is the coverage that flag actually needs.
      - name: Tests — fanos-node with validator features, alone
        run: cargo test -p fanos-node --features validator --no-fail-fast
      - name: Reference verifier (V1–V22)
        run: cargo run -p fanos-cli
      - name: Simulator demo (real engines, substituted transport)
        run: cargo run -p fanos-sim --bin fanos-sim-demo
      - name: Cascade forecast (leading indicator, before collapse)
        run: cargo run -p fanos-sim --example forecast
      - name: Catastrophe probe (loss · churn · scale)
        run: cargo run -p fanos-sim --example catastrophe
      - name: Benchmarks compile (hot paths)
        run: cargo bench -p fanos-bench --no-run
      # The docs are where this codebase carries its reasoning, and an intra-doc link is the only part of a
      # doc comment a compiler can check. Nothing checked them: 183 were broken across the workspace when this
      # gate was first run, including links to items that had been renamed, moved to another crate, or made
      # private — each one a reader sent to a page that does not exist. Several crates failed to document at
      # ALL, which hid the errors in every crate downstream of them.
      #
      # `--no-deps` because a dependency's docs are not this repo's to fix, and no `--document-private-items`:
      # the gate should see what a reader sees, and private items resolve differently.
      - name: Docs — no broken intra-doc links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  reproducible:
    name: reproducible release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      # `docs/design-upgrade.md` §6: "the release key is the power that does not dilute". Every other founding
      # advantage decays as the network grows — bootstrap visibility, monitoring share, the beacon moving to
      # DKG — but whoever publishes builds can change any derivation, any threshold, any bound in that
      # document, and §1 established that derivation changes are silent on the wire. Signing binds an artefact
      # to a key; only REPRODUCIBILITY lets anyone else check the artefact against the source, which is what
      # makes the signature worth anything.
      #
      # Two builds from different source paths AND different target directories, compared byte for byte. The
      # source path is the half that usually breaks first: rustc embeds absolute paths in panic locations and
      # debug info, so a build that is reproducible in place can still differ between two checkouts.
      #
      # Verified locally before this job was written, on `fanos-verify`: identical across both axes with no
      # `--remap-path-prefix` needed, and the comparison shown to be LIVE by perturbing a printed string and
      # watching the hash move. A first probe added dead code instead and the hashes matched — correctly, since
      # `opt-level = 3` deletes it. A reproducibility gate that compares two builds of nothing is the easiest
      # green in CI.
      - name: Build twice from different paths
        run: |
          set -euo pipefail
          # The workflow's `defaults.run.working-directory` is already `rust`, so this copies `.` — not
          # `rust`. The first version of this job wrote `-C rust` and died with "tar: rust: Cannot open",
          # which is what shipping a CI job whose *shell* was never run looks like: the reproducibility
          # method was validated locally, the six lines around it were not.
          mkdir -p /tmp/build-a /tmp/build-b
          tar --exclude=./target -cf - . | tar -C /tmp/build-a -xf -
          tar --exclude=./target -cf - . | tar -C /tmp/build-b -xf -
          ( cd /tmp/build-a && CARGO_TARGET_DIR=/tmp/target-a cargo build --release -p fanos-cli -p fanos-node )
          ( cd /tmp/build-b && CARGO_TARGET_DIR=/tmp/target-b cargo build --release -p fanos-cli -p fanos-node )
      - name: Compare the artefacts
        run: |
          set -euo pipefail
          status=0
          for bin in fanos-verify fanos; do
            a=$(sha256sum "/tmp/target-a/release/$bin" | cut -d' ' -f1)
            b=$(sha256sum "/tmp/target-b/release/$bin" | cut -d' ' -f1)
            if [ "$a" = "$b" ]; then
              echo "reproducible: $bin  $a"
            else
              echo "NOT REPRODUCIBLE: $bin"
              echo "  build a: $a"
              echo "  build b: $b"
              status=1
            fi
          done
          exit $status

  portability:
    name: no_std · wasm cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # **wasm32 alone is not a sufficient no_std gate, and this job used to be exactly that.** wasm has
      # native `f64.ceil`/`f64.nearest` instructions, so a `no_std` crate calling the inherent `f64::ceil`
      # compiles for wasm32 while failing on every float-less target (Cortex-M, RISC-V) that a `libm`
      # feature exists to serve. `fanos-diakrisis` shipped exactly that defect: three inherent-method calls
      # that its own `mathfns` shim was written to prevent, invisible here for as long as wasm was the
      # only target checked. So the same crates are ALSO checked with `cargo check` on the host toolchain,
      # where those methods genuinely do not exist without `std` — a strictly stricter gate, and cheap.
      - name: Check the no_std core on the host target (no wasm float intrinsics to hide behind)
        run: |
          cargo check -p fanos-diakrisis --no-default-features --features libm
          cargo check -p fanos-diakrisis --no-default-features --features "alloc libm"
          cargo check -p fanos-telemetry --no-default-features --features "alloc libm"
          cargo check -p fanos-ports     --no-default-features --features "alloc libm"
          cargo check -p fanos-nyx       --no-default-features --features "alloc libm"
          cargo check -p fanos-runtime   --no-default-features --features "alloc libm"
      # Every line below is verified to build for wasm32 with exactly these features. `fanos-runtime` needs
      # `alloc` as well as `libm`: its overlay engine is heapful (the erasure/DA modules it imports from
      # fanos-code are `alloc`-gated), which is the embedded build its own manifest documents.
      - name: Build the no_std core for wasm32
        run: |
          cargo build -p fanos-field     --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-geometry  --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-code      --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-wire      --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-pqcrypto  --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-diakrisis --target wasm32-unknown-unknown --no-default-features --features libm
          cargo build -p fanos-nyx       --target wasm32-unknown-unknown --no-default-features --features "alloc libm"
          cargo build -p fanos-runtime   --target wasm32-unknown-unknown --no-default-features --features "alloc libm"
          cargo build -p fanos-calypso   --target wasm32-unknown-unknown --no-default-features --features alloc
          cargo build -p fanos-proteus   --target wasm32-unknown-unknown --no-default-features --features alloc
          cargo build -p fanos-telemetry --target wasm32-unknown-unknown --no-default-features --features libm

  miri:
    name: miri (undefined-behavior check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain + miri
        run: |
          rustup show
          rustup component add miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `fanos-ffi` is the *only* crate in the workspace containing `unsafe` (57 sites — it is the C ABI);
      # every other crate denies or forbids it via `[workspace.lints]`. So this is the one place Miri can find
      # a memory-safety bug, and any other target would be checking code that cannot contain one.
      #
      # Miri cannot drive a reactor (kqueue/epoll are unsupported foreign calls), so the crate's handle paths
      # are `cfg_attr(miri, ignore)`d and its raw-pointer contracts — borrowing caller buffers, the size-probe
      # copy-out, the C-string terminator — are factored into runtime-free functions that Miri does execute.
      # Verified load-bearing by injecting two off-by-one errors (capacity check, terminator offset): Miri
      # reports both as out-of-bounds writes.
      - name: Miri — the C ABI's raw-pointer surface
        run: cargo miri test -p fanos-ffi --lib

  # Every assertion whose cost rules it out of the per-push gate: the real-parameter zero-knowledge proofs, the
  # randomized no-fork searches, and the three multi-node real-QUIC paths listed in
  # `fanos-cli/tests/ignored_tests.rs::COST_GATED` (the C ABI pair and the fabric seam — unreliable when a
  # full-workspace run saturates the loopback). Nightly, and on demand.
  #
  # NOT the whole real-QUIC suite: `dromos_quic`, `taxis_quic`, `anonymous_quic`, `exit_quic`, `mix_directory_quic`
  # and `diaulos_quic` carry no `#[ignore]` and run in the per-push gate above. An earlier wording of this comment
  # read as though the class were ignored wholesale, which is worth correcting because the difference is exactly
  # where a flaky e2e test blocks a merge.
  heavy:
    name: cost-gated assertions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A hang here starves everything after it: the set runs serially in one command, and `fanos-ffi` sorts ahead
    # of `fanos-obolos`, so one stuck test cost the zero-knowledge proofs their entire run. Verified by trying it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Selected by *class*, not by package. `#[ignore]` carries two meanings here — a measurement that prints
      # for a person to read and must never gate, and a cost-gated assertion that must gate somewhere — and
      # `fanos-cli/tests/ignored_tests.rs` holds the workspace to the naming convention that separates them, so
      # this `--skip` set provably selects exactly the assertions. Release, because the zero-knowledge proofs
      # are minutes in debug and ~40 s optimised; serial, because several stand up whole real-QUIC cells.
      #
      # `host_a_service_and_serve_a_client_over_the_c_abi` runs as its own step below rather than in this set,
      # because it is **intermittent in release** — roughly 3 failures in 15 optimised runs, always fast (0.01 s)
      # when it passes and 150 s or worse when it does not, with no discriminator found across alone-vs-paired,
      # thread count, or instrumentation. Once, in the full serial set, it did not return for 34 minutes; since
      # `fanos-ffi` sorts ahead of `fanos-obolos` that stall cost the zero-knowledge proofs their entire run.
      # Ordering it last means the assertions this job exists for finish first whatever it does, and its own short
      # timeout bounds a stall. A plain *failure* would not starve them within one target — libtest continues —
      # but it WOULD have starved every target ordered after it, which is why `--no-fail-fast` is here too:
      # cargo's default stops the whole run at the first failing binary. See the note on the tests job above.
      - name: Cost-gated assertions (every ignored test that is not a measurement)
        run: cargo test --workspace --features validator --release --no-fail-fast -- --ignored --skip measure_ --skip probe_ --skip sweep_ --skip host_a_service_and_serve_a_client --test-threads 1
      - name: C ABI service host (ordered last — see above)
        timeout-minutes: 5
        run: cargo test -p fanos-ffi --release -- --ignored --test-threads 1 host_a_service_and_serve_a_client
