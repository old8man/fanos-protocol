name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The heavy suites below are too slow for every push, but a proof that goes unrun is a proof that decays.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  # The nightly toolchain, components, and targets are pinned by rust/rust-toolchain.toml,
  # so every job installs exactly the same compiler.
  #
  # NOTE ON FORMATTING: there is deliberately no `cargo fmt --check` step. The source is hand-wrapped to a
  # denser width than rustfmt's 100-column default (that density is what keeps the pedantic clippy set
  # readable), so `cargo fmt` rewrites ~2650 hunks of intentional formatting. A gate that has never passed
  # cannot catch anything and — as the first step of this job — hid every gate below it.
  gate:
    name: clippy · test · verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show   # rust-toolchain.toml drives the install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Both feature configurations are linted and tested: `validator` compiles the ledger/consensus paths,
      # and three `cfg(not(feature = "validator"))` fallbacks exist that only the default build sees. Neither
      # configuration is a superset of the other, so neither run is redundant.
      - name: Clippy — default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy — validator features
        run: cargo clippy --workspace --all-targets --features validator -- -D warnings
      # A third configuration, compile-only: the VPN datapath is behind `vpn` because it pulls a real TUN
      # device, so neither clippy run above sees a line of it. A feature nobody builds is a feature that
      # rots — this is the cheapest possible guard against that, and it is not a substitute for exercising
      # the datapath (nothing does yet).
      - name: Clippy — the vpn feature (real TUN device)
        run: cargo clippy -p fanos-node --features vpn --all-targets -- -D warnings
      - name: Tests — default features
        run: cargo test --workspace
      - name: Tests — validator features (ledger · consensus · TAXIS)
        run: cargo test --workspace --features validator
      - name: Reference verifier (V1–V22)
        run: cargo run -p fanos-cli
      - name: Simulator demo (real engines, substituted transport)
        run: cargo run -p fanos-sim --bin fanos-sim-demo
      - name: Cascade forecast (leading indicator, before collapse)
        run: cargo run -p fanos-sim --example forecast
      - name: Catastrophe probe (loss · churn · scale)
        run: cargo run -p fanos-sim --example catastrophe
      - name: Benchmarks compile (hot paths)
        run: cargo bench -p fanos-bench --no-run

  portability:
    name: no_std · wasm cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Every line below is verified to build for wasm32 with exactly these features. `fanos-runtime` needs
      # `alloc` as well as `libm`: its overlay engine is heapful (the erasure/DA modules it imports from
      # fanos-code are `alloc`-gated), which is the embedded build its own manifest documents.
      - name: Build the no_std core for wasm32
        run: |
          cargo build -p fanos-field     --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-geometry  --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-code      --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-wire      --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-pqcrypto  --target wasm32-unknown-unknown --no-default-features
          cargo build -p fanos-diakrisis --target wasm32-unknown-unknown --no-default-features --features libm
          cargo build -p fanos-nyx       --target wasm32-unknown-unknown --no-default-features --features "alloc libm"
          cargo build -p fanos-runtime   --target wasm32-unknown-unknown --no-default-features --features "alloc libm"
          cargo build -p fanos-calypso   --target wasm32-unknown-unknown --no-default-features --features alloc
          cargo build -p fanos-proteus   --target wasm32-unknown-unknown --no-default-features --features alloc
          cargo build -p fanos-telemetry --target wasm32-unknown-unknown --no-default-features --features libm

  miri:
    name: miri (undefined-behavior check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain + miri
        run: |
          rustup show
          rustup component add miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `fanos-ffi` is the *only* crate in the workspace containing `unsafe` (57 sites — it is the C ABI);
      # every other crate denies or forbids it via `[workspace.lints]`. So this is the one place Miri can find
      # a memory-safety bug, and any other target would be checking code that cannot contain one.
      #
      # Miri cannot drive a reactor (kqueue/epoll are unsupported foreign calls), so the crate's handle paths
      # are `cfg_attr(miri, ignore)`d and its raw-pointer contracts — borrowing caller buffers, the size-probe
      # copy-out, the C-string terminator — are factored into runtime-free functions that Miri does execute.
      # Verified load-bearing by injecting two off-by-one errors (capacity check, terminator offset): Miri
      # reports both as out-of-bounds writes.
      - name: Miri — the C ABI's raw-pointer surface
        run: cargo miri test -p fanos-ffi --lib

  # Suites whose cost rules them out of the per-push gate: the real-parameter zero-knowledge proofs, and the
  # multi-node real-QUIC end-to-end paths, which are unreliable when a full-workspace run saturates the
  # loopback transport and so are `#[ignore]`d there. Nightly, and on demand. Both commands are verified as
  # written: 7 proofs in 38 s (release, serial), and 2 end-to-end C ABI paths in 0.17 s.
  heavy:
    name: zero-knowledge · real-QUIC end-to-end
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: OBOLOS shielded-transaction proofs at real parameters
        run: cargo test -p fanos-obolos --release -- --ignored --test-threads 1
      - name: C ABI service host/connect over real QUIC
        run: cargo test -p fanos-ffi -- --ignored --test-threads 1
