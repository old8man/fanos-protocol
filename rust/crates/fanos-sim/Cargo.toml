[package]
name = "fanos-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic in-process network simulator that drives the real FANOS node engines (swaps environment + transport)."
keywords = ["simulation", "discrete-event", "p2p", "deterministic", "fanos"]
categories = ["simulation", "network-programming"]

[dependencies]
# ERGON keys — `fanos_dromos::scheduler::AccessList` is keyed by them (docs/design-ergon.md §11 step 3), so a test
# building access lists needs the key type.
fanos-ergon.workspace = true
fanos-field.workspace = true
fanos-geometry.workspace = true
fanos-diakrisis.workspace = true
fanos-wire.workspace = true
fanos-runtime = { workspace = true, features = ["std"] }
# The in-memory datagram fabric implements quinn's AsyncUdpSocket, so real nodes run over a modelled carrier
# (`fabric.rs`) — the transport-injection seam of docs/design-testing.md §5.1.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
# Real nodes over the modelled fabric: `fabric.rs` tests spawn genuine self-certifying nodes through the
# `fanos_quic::Fabric::Abstract` seam, so the whole production path above the socket is exercised.
fanos-quic.workspace = true
# `MAX_WIRE_OVERHEAD` — the one transform that grows every frame on every path. The sim ACCOUNTS for the
# growth without performing it (#195), so it needs the number and none of the obfuscation.
fanos-proteus.workspace = true
fanos-vrf.workspace = true
# The composed-node fleet (`fabric::NodeFleet`) drives REAL deployed nodes over the modelled carrier, which is the
# only way a scenario can observe the node's composition (docs/design-testing.md §5.1). No cycle: fanos-node does
# not depend on fanos-sim.
fanos-node.workspace = true
# Decode the coherence frames nodes publish (`Notification::Observed`) into per-node snapshots for the
# fleet-scale state inspection surface (`fleet` module — the dashboard/CLI data contract).
fanos-telemetry = { workspace = true, features = ["std"] }

[[bin]]
name = "fanos-sim-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "fanos-sim-experiment"
path = "src/bin/experiment.rs"

[dev-dependencies]
# The measurement-conditions stamp: a wall-clock number must publish what it is worth (#255).
fanos-testkit = { path = "../fanos-testkit" }
proptest.workspace = true
# For the DIAULOS-over-overlay scenario (a reliable encrypted session over the datagram transport).
fanos-diaulos.workspace = true
# For the anonymous-rendezvous scenario (DIAULOS payloads over threshold onions to a meeting line).
fanos-rendezvous.workspace = true
# For the NYX anonymity-routing scenario (real onion over the simulated network).
fanos-aphantos.workspace = true
fanos-pqcrypto.workspace = true
# For the L4 storage scenarios (computing a key's responsible node, MapToPoint).
fanos-primitives = { workspace = true, features = ["std"] }
# For the L4 erasure-resilience scenario (the is_recoverable_fano oracle the read must match, #115).
fanos-code = { workspace = true, features = ["std"] }
# For the THESAUROS storage-market scenarios (deal engine + proof-of-retrievability audit dynamics).
fanos-thesauros = { workspace = true, features = ["std"] }
# For the DROMOS parallel-execution scenarios (the scheduler's contention-vs-parallelism characterization).
fanos-dromos.workspace = true
# For the hierarchy scenario (feeding a child cell's escalation to the parent tier).
fanos-core = { workspace = true, features = ["std"] }
# For the CALYPSO hidden-service flow (address, per-epoch rendezvous, PoW) over the overlay.
fanos-calypso.workspace = true
# For the ONOMA name-system resolution scenario (address derivations + descriptor publish/resolve).
fanos-onoma.workspace = true
# For the NYX mixnet scenarios (anonymity-set entropy math).
fanos-nyx = { workspace = true, features = ["std"] }
# For the networked DKG scenario (DkgNode engine driven over the sim), and the MixRelay composite (via
# fanos-node) for the E4∩E5 mix-relay scenario.
fanos-keygen.workspace = true
fanos-node.workspace = true
# For crafting the adversary's dealing in the Byzantine-equivocating-dealer DKG scenario.
fanos-vrf.workspace = true
# For crafting Byzantine/forged frames in the adversary scenarios.
fanos-wire = { workspace = true, features = ["std"] }
# For the anonymous paid-introduction scenario (VOPRF relay credits over the CALYPSO flow).
fanos-incentives.workspace = true
rand_core.workspace = true

[lints]
workspace = true
