[package]
name = "fanos-aphantos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "APHANTOS integration: a KEM-sealed NYX onion and a sans-I/O NyxNode engine that routes it (spec §L5)."
keywords = ["onion-routing", "anonymity", "post-quantum", "sans-io", "fanos"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Constant-time comparison for the holonomy path-authenticator: `==` on `[u8; 32]` short-circuits,
# and the right-hand side arrives on the wire (see `verify_holonomy`).
subtle.workspace = true
fanos-field = { workspace = true, features = ["std"] }
fanos-geometry = { workspace = true, features = ["std"] }
fanos-primitives = { workspace = true, features = ["std", "aead"] }
fanos-wire = { workspace = true, features = ["std"] }
fanos-nyx = { workspace = true, features = ["std"] }
# NyxNode / ThresholdRouter are sans-I/O engines that speak only the contract vocabulary — the light leaf,
# not the whole OverlayNode engine crate (audit #73/#125).
# It also carries the data-path plane's station counters (docs/design-observability.md): a threshold gather
# is where work most often stops, #55 showed that stop was invisible, and recording is a field write on paths
# already failing — so the engine stays sans-I/O. They live beside `GatherClock` here rather than in
# fanos-telemetry, whose subject is the *coherence* self-model; this is instrumentation of the data path, needs
# only the geometry's coordinate type, and belongs where every engine can already reach it.
fanos-ports = { workspace = true, features = ["std"] }
fanos-pqcrypto.workspace = true
fanos-threshold = { workspace = true, features = [] }
rand_core.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
