# FANOS — reference implementation (Rust).
#
# A Cargo virtual workspace whose crates mirror the protocol's module structure
# (spec Part XI): the layers L0–L7 plus the cross-cutting DIAKRISIS plane, each a
# separate crate with a clean interface, so a build selects exactly what it needs
# ("DHT only", "DHT+VPN", or the full mixnet+services stack) and stays wire-compatible
# with the others via the canonical encoding (spec Part VII §7.9).
[workspace]
resolver = "3"
members = [
    "crates/fanos-field",
    "crates/fanos-threshold",
    "crates/fanos-ergon",
    "crates/fanos-geometry",
    "crates/fanos-code",
    "crates/fanos-diakrisis",
    "crates/fanos-holarch",
    "crates/fanos-wire",
    "crates/fanos-wire-derive",
    "crates/fanos-primitives",
    "crates/fanos-aphantos",
    "crates/fanos-calypso",
    "crates/fanos-core",
    "crates/fanos-nyx",
    "crates/fanos-pqcrypto",
    "crates/fanos-proteus",
    "crates/fanos-quic",
    "crates/fanos-runtime",
    "crates/fanos-stream",
    "crates/fanos-ports",
    "crates/fanos-vrf",
    "crates/fanos-onoma",
    "crates/fanos-incentives",
    "crates/fanos-keygen",
    "crates/fanos-sim",
    "crates/fanos-diaulos",
    "crates/fanos-telemetry",
    "crates/fanos-session",
    "crates/fanos-rendezvous",
    "crates/fanos-node",
    "crates/fanos-testkit",
    "crates/fanos-ffi",
    "crates/fanos-vpn",
    "crates/fanos-proxy",
    "crates/fanos-cli",
    "crates/fanos-bench",
    "crates/fanos-observatory",
    "crates/fanos-taxis",
    "crates/fanos-obolos",
    "crates/fanos-dromos",
    "crates/fanos-angelos",
    "crates/fanos-thesauros",
    "crates/fanos-hermes",
    "crates/fanos-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/old8man/fanos-protocol"
authors = ["FANOS contributors"]
description = "FANOS — a projective-plane-addressed overlay network (reference implementation)"
keywords = ["p2p", "overlay", "anonymity", "post-quantum", "projective-plane"]
categories = ["network-programming", "cryptography"]

# ----------------------------------------------------------------------------
# Strictest-standard lint policy, shared by every crate via `[lints] workspace = true`.
# CI runs `cargo clippy --all-targets -- -D warnings`, so each of these is a hard gate.
# ----------------------------------------------------------------------------
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"                  # math crates further tighten this to `forbid`
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Correctness/robustness lints escalated to hard errors.
unwrap_used = "warn"
expect_used = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
# Pragmatic allowances: FANOS deliberately truncates in field reduction and carries
# domain terminology that trips a few stylistic pedantic lints.
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"   # small counts (n ≤ cell size) cast to f64; no real loss
cast_possible_wrap = "allow"    # bounded small indices/exponents
similar_names = "allow"
# **The narrowing-cast allowances above are owed work, and their reason is narrower than their scope**
# (#110). "FANOS deliberately truncates in field reduction" is true of `fanos-field`, `fanos-primitives`,
# the crypto crates and the wire codecs, where narrowing into a fixed width *is* the specified operation.
# It has nothing to do with the length and count casts it also covers elsewhere, where a prefix that wraps
# encodes two different values identically and the decoder reads a short buffer — #75's "one frame type,
# two encodings", with the ambiguity created by arithmetic instead of by a second implementation.
#
# Measured by removing them: **~90 sites across ~20 crates**, of which the dangerous class — a length or
# count crossing the wire — is small and has been fixed at the site with the bound named:
# `fanos-stream::total`/`Ack::held`, `fanos-diaulos::frame`, `fanos-cli`, `fanos-code::hamming`,
# `fanos-ergon`, `fanos-testkit`, `fanos-thesauros`, `fanos-vpn`, `fanos-proxy`, and — the one that
# mattered — **`fanos-keygen`'s beacon reshare trigger, whose roster length fields now refuse rather than
# wrap**, because two members reading two different contributor sets from bytes that verify is the single
# failure that authenticated message exists to prevent.
#
# What remains is quantisation (`loss × 255`), plane-bounded indices, and test harnesses. Scoping the lint
# per crate was attempted and abandoned in the same session: done crate-by-crate it reproduces exactly this
# defect at crate granularity — twenty near-identical exemptions, each as unread as one global line. Doing
# it properly means per-site bounds, which is #110's own work and not a side effect of another task.
#
# **Narrowing casts are NOT allowed workspace-wide.** They used to be, justified by "FANOS deliberately
# truncates in field reduction" — a statement that is true of `fanos-field`, `fanos-primitives` and the
# crypto crates, and has nothing to do with the twenty-two length casts it also covered in `fanos-taxis`,
# `fanos-onoma`, `fanos-dromos`, `fanos-threshold`, `fanos-stream`, `fanos-diaulos`, `fanos-core` and
# `fanos-angelos`. Every one of those was safe, but safe *by an invariant maintained somewhere else* rather
# than by the compiler — the shape that let an opt-in Sybil cap ship switched off (#76) and a workspace
# proxy gate pass vacuously for its whole life.
#
# The failure a narrowing length cast produces is not a panic but a **canonical-encoding break**: a length
# prefix that wraps encodes two different values identically and the decoder reads a short buffer, which is
# #75's "one frame type, two encodings" with the ambiguity created by arithmetic instead of by a second
# implementation. The tree's own idiom is already `u8::try_from(..)` with an explicit refusal
# (`fanos-calypso::deal_service_key`, `PorosHost::emit_reshare`), so a site that genuinely needs the cast
# carries a local `#[expect(..)]` **naming the bound** — which makes the invariant visible where it is
# relied on. The crates whose reason it actually is re-allow these in their own `[lints]` block.
doc_markdown = "allow"
inline_always = "allow"
many_single_char_names = "allow" # dense numerical kernels use math-style names
missing_errors_doc = "allow"     # error types (WireError etc.) are self-documenting enums

[workspace.dependencies]
# Foundational math crates are zero-dependency; only fanos-primitives and above pull externals.
fanos-field = { path = "crates/fanos-field", version = "0.1.0", default-features = false }
fanos-geometry = { path = "crates/fanos-geometry", version = "0.1.0", default-features = false }
fanos-code = { path = "crates/fanos-code", version = "0.1.0", default-features = false }
fanos-diakrisis = { path = "crates/fanos-diakrisis", version = "0.1.0", default-features = false }
# ХОЛАРХ — the architecture viability gate (the platform's own definition of done, spec/platform.md §1).
fanos-holarch = { path = "crates/fanos-holarch", version = "0.1.0" }
fanos-wire = { path = "crates/fanos-wire", version = "0.1.0", default-features = false }
fanos-wire-derive = { path = "crates/fanos-wire-derive", version = "0.1.0" }
fanos-primitives = { path = "crates/fanos-primitives", version = "0.1.0", default-features = false }
fanos-threshold = { path = "crates/fanos-threshold", version = "0.1.0", default-features = false }
fanos-pqcrypto = { path = "crates/fanos-pqcrypto", version = "0.1.0" }
fanos-onoma = { path = "crates/fanos-onoma", version = "0.1.0", default-features = false }
fanos-core = { path = "crates/fanos-core", version = "0.1.0", default-features = false }
fanos-runtime = { path = "crates/fanos-runtime", version = "0.1.0", default-features = false }
# The reliable-stream reliability layer as a standalone transport-agnostic leaf (audit #73).
fanos-stream = { path = "crates/fanos-stream", version = "0.1.0", default-features = false }
# The sans-I/O contract as a light leaf crate (audit #73/#125).
fanos-ports = { path = "crates/fanos-ports", version = "0.1.0", default-features = false }
fanos-telemetry = { path = "crates/fanos-telemetry", version = "0.1.0", default-features = false }
# Privacy / transport / service layers and the DKG node — declared here so every consumer references
# them uniformly as `<crate>.workspace = true`, never a bare `path` (one source of truth for versions).
fanos-proteus = { path = "crates/fanos-proteus", version = "0.1.0", default-features = false }
fanos-vrf = { path = "crates/fanos-vrf", version = "0.1.0", default-features = false }
fanos-incentives = { path = "crates/fanos-incentives", version = "0.1.0", default-features = false }
# TAXIS — the FANOS-native BFT blockchain (spec Part X.1 / M7): projective-cell PBFT consensus,
# beacon leader election, threshold-encrypted anti-MEV mempool, DA-sampled blocks.
fanos-taxis = { path = "crates/fanos-taxis", version = "0.1.0" }
fanos-obolos = { path = "crates/fanos-obolos", version = "0.1.0", default-features = false }
fanos-dromos = { path = "crates/fanos-dromos", version = "0.1.0", default-features = false }
fanos-ergon = { path = "crates/fanos-ergon", version = "0.1.0" }
fanos-angelos = { path = "crates/fanos-angelos", version = "0.1.0", default-features = false }
fanos-thesauros = { path = "crates/fanos-thesauros", version = "0.1.0", default-features = false }
fanos-hermes = { path = "crates/fanos-hermes", version = "0.1.0", default-features = false }
fanos-aphantos = { path = "crates/fanos-aphantos", version = "0.1.0" }
fanos-calypso = { path = "crates/fanos-calypso", version = "0.1.0" }
fanos-diaulos = { path = "crates/fanos-diaulos", version = "0.1.0" }
fanos-keygen = { path = "crates/fanos-keygen", version = "0.1.0" }
fanos-quic = { path = "crates/fanos-quic", version = "0.1.0" }
fanos-session = { path = "crates/fanos-session", version = "0.1.0" }
fanos-rendezvous = { path = "crates/fanos-rendezvous", version = "0.1.0" }
fanos-proxy = { path = "crates/fanos-proxy", version = "0.1.0" }
fanos-vpn = { path = "crates/fanos-vpn", version = "0.1.0" }
fanos-node = { path = "crates/fanos-node", version = "0.1.0" }

# External dependencies (isolated to the crypto/privacy layers and above).
blake3 = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Secret-material zeroization (wipe key bytes on drop). `no_std`; crates opt into `alloc` as needed.
zeroize = { version = "1", default-features = false }
# `libm` float backend for the no_std DIAKRISIS/NYX math (an optional dep in those crates).
libm = { version = "0.2", default-features = false }
# The RustCrypto RNG trait line (0.10), used by the PQ-KEM/onion/driver crates. NB: fanos-vrf,
# -incentives, and -sim pin rand_core 0.6 locally — the curve25519-dalek v4 / vrf-r255 ecosystem —
# a genuine two-major-version split that collapses only when those upstreams migrate.
rand_core = { version = "0.10", default-features = false }
# ristretto255 group ops for the verifiable-crypto crates (ECVRF, VOPRF).
curve25519-dalek = { version = "4", features = ["rand_core", "zeroize"] }
# Constant-time equality for MAC/authenticator checks (the version curve25519-dalek v4 already pins).
subtle = { version = "2", default-features = false }

# Async runtime + tracing for the I/O driver layer (quic/node/proxy/session). Base version here; each
# driver selects only the tokio features it needs.
tokio = { version = "1", default-features = false }

# TEST HARNESS ONLY (a dev-dependency of `fanos-node`), for `getloadavg`. The integration harness charges its
# frozen-window budget by the share of a CPU a runnable task can actually expect, and system load is the only
# portable measure of that; nothing in the shipped crates links it.
libc = { version = "0.2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The real post-quantum hybrid primitives (Ed25519+ML-DSA-65, X25519+ML-KEM-768) live in the
# `fanos-pqcrypto` crate (RustCrypto `ed25519-dalek`/`x25519-dalek`/`ml-kem`/`ml-dsa`, all `no_std`),
# which owns those dependencies directly — so the light math core (`fanos-primitives`, BLAKE3-only) stays
# free of them and only the crates that need real keys pull them in.

# Terminal UI for the operator observatory (`fanos-monitor`): a native, embedded-friendly TUI — no
# browser, minimal resources. `crossterm` is the terminal backend.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# The operator CLI (`fanos-lab`): a structured, derive-based argument surface (spec: productivity-first CLI).
clap = { version = "4", features = ["derive"] }

# Test-only: property-based testing across all crates.
proptest = "1"

# Proc-macro toolchain — used ONLY by the `fanos-wire-derive` build-time crate (compile-time deps; they
# do not ship in any binary), so the runtime/foundational crates stay dependency-light.
syn = { version = "2", features = ["derive"] }
quote = "1"
proc-macro2 = "1"

fanos-nyx = { path = "crates/fanos-nyx", version = "0.1.0", default-features = false }
fanos-sim = { path = "crates/fanos-sim", version = "0.1.0", default-features = false }
# (fanos-observatory, -node, -cli are binary crates — nothing depends on them, so no table entry.)

# ----------------------------------------------------------------------------
# Build profiles. FANOS targets "extreme performance"; the default release build
# stays fast to compile, and `maxperf` is the ship profile (whole-program LTO).
# ----------------------------------------------------------------------------
# **Dependencies are optimized in dev and test; workspace crates are not** (#157).
#
# Nobody steps through a lattice NTT or a BLAKE3 rotate in a debugger, and at `opt-level = 0` those are what
# the test suite spends its time on. Measured rather than assumed: the slowest target (`consensus_sim`,
# 51 tests) was **62% of the whole workspace suite's wall clock** — 1185 s against 105 s for the next slowest
# — running at 100% CPU, so it was computing, not waiting. A 5-second `sample` of the live process attributed
# it: `ml_dsa` 2011 samples, `blake3` 1055, `ml_kem` 285, `sha3` 213, with
# `core::intrinsics::rotate_right` appearing as an **out-of-line function call** (256 samples) — one `ROR`
# instruction in any optimized build.
#
# The glob covers dependencies only, so every `fanos-*` crate stays at `opt-level = 0` and fully debuggable;
# `[profile.test]` inherits from `[profile.dev]`, so the suite gets it too. The cost is a one-time dependency
# rebuild — incremental workspace builds are untouched.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

# Ship / benchmark profile: whole-program optimization, single codegen unit.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
